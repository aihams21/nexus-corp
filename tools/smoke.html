<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcade Smoke Harness</title>
<style>body{background:#090D16;color:#10B981;font:12px monospace;margin:0}
canvas{width:640px;height:480px;border:1px solid #333;image-rendering:pixelated}
#log{padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<canvas id="stage" width="640" height="480"></canvas>
<div id="log"></div>
<script type="module">
import { ArcadeHub, GAMES } from '../src/arcade/arcade_hub.js';
import audio from '../src/core/audio.js';

const errors = [];
window.addEventListener('error', (e) => errors.push('window.onerror: ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => errors.push('unhandledrejection: ' + (e.reason && e.reason.stack || e.reason)));
const origErr = console.error;
console.error = (...a) => { errors.push('console.error: ' + a.join(' ')); origErr(...a); };

const canvas = document.getElementById('stage');
const stageCtx = canvas.getContext('2d');

const finishes = [];
const hub = new ArcadeHub({
  canvas,
  audio,
  fx: null,
  onScore: () => {},
  onFinish: (score, id) => { finishes.push({ id, score }); },
  onExit: () => {},
  onError: (m) => errors.push('hub.onError: ' + m),
});

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'w', 'a', 's', 'd',
  'e', 'q', 'r', 'x', 'Enter', 'Escape', '1', '2', '3'];

function fireKey(type, key, code) {
  for (const target of [window, document, canvas]) {
    target.dispatchEvent(new KeyboardEvent(type, { key, code: code || key, bubbles: true, cancelable: true }));
  }
}
function firePointer(type, x, y) {
  for (const target of [canvas, window]) {
    target.dispatchEvent(new PointerEvent(type, {
      clientX: x, clientY: y, button: 0, buttons: type === 'pointerup' ? 0 : 1,
      pointerId: 1, pointerType: 'mouse', bubbles: true, cancelable: true,
    }));
  }
}
/** Hash of the canvas pixels — proves the loop actually drew something. */
function pixelSig() {
  const d = stageCtx.getImageData(0, 0, canvas.width, canvas.height).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 997) { h ^= d[i]; h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const results = [];
for (const g of GAMES) {
  const rec = { id: g.id, name: g.name || g.id, ok: false, frames: 0, error: null };
  const before = errors.length;
  try {
    const launched = await hub.launch(g.id);
    if (!launched) throw new Error('launch() returned false');

    // Exercise real input paths while frames are running.
    const t0 = performance.now();
    let frame = 0;
    while (performance.now() - t0 < 1400) {
      frame++;
      firePointer('pointermove', 60 + (frame * 37) % 520, 60 + (frame * 53) % 360);
      if (frame % 3 === 0) firePointer('pointerdown', 80 + (frame * 61) % 480, 80 + (frame * 43) % 320);
      if (frame % 3 === 1) firePointer('pointerup', 80 + (frame * 61) % 480, 80 + (frame * 43) % 320);
      if (frame % 4 === 0) fireKey('keydown', KEYS[frame % KEYS.length]);
      if (frame % 4 === 2) fireKey('keyup', KEYS[frame % KEYS.length]);
      if (frame % 25 === 0) {
        fireKey('keydown', 'async'); fireKey('keyup', 'async');
        fireKey('keydown', 'kernel'); fireKey('keyup', 'kernel');
      }
      await sleep(16);
    }
    rec.frames = frame;

    const sig = pixelSig();
    rec.drawn = sig !== 0 && sig !== undefined;
    // Prove the canvas is not a blank single-colour field.
    const px = stageCtx.getImageData(0, 0, canvas.width, canvas.height).data;
    let distinct = new Set();
    for (let i = 0; i < px.length; i += 4 * 5011) distinct.add(px[i] << 16 | px[i + 1] << 8 | px[i + 2]);
    rec.distinctColors = distinct.size;

    hub.unmount();
    // Lifecycle check: nothing must be left claiming a loop or listeners.
    if (hub.isActive()) throw new Error('hub still active after unmount');
    if (hub.activeId !== null) throw new Error('activeId not cleared');
    rec.teardownClean = true;

    rec.ok = rec.distinctColors > 1 && rec.newErrors === 0;
    rec.newErrors = errors.length - before;
    rec.ok = rec.distinctColors > 1 && rec.newErrors === 0;
  } catch (err) {
    rec.error = String((err && err.stack) || err);
    rec.newErrors = errors.length - before;
    try { hub.unmount(); } catch (_) {}
  }
  results.push(rec);
}

hub.unmount();
window.__SMOKE__ = { results, errors, finishes, gameCount: GAMES.length };
window.__SMOKE_DONE__ = true;
document.getElementById('log').textContent =
  'done: ' + results.filter((r) => r.ok).length + '/' + GAMES.length + ' ok, errors=' + errors.length;
</script>
</body>
</html>
